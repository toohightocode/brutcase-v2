<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brutcase | A Showcase Project</title>
    <link rel="stylesheet" href="src/styles.min.css">
    <link rel="stylesheet" href="src/customs.css">
    <!-- arrow down-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_downward" />
</head>
<body>
    <!-- SECTION 1: HERO -->
    <section id="sec1" class="relative w-full h-screen grayscale flex items-center">
        <!-- Gradient Overlays -->
        <div class="absolute inset-0 bg-gradient-to-r from-black via-black/70 to-transparent z-[5]"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/30 z-[5]"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-black/20 z-[5]"></div>
        
        <img class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full h-full object-cover object-bottom z-[1]"
            src="https://images.unsplash.com/photo-1692808615989-9ca39f10b5c3?q=80&w=2070&auto=format&fit=crop" 
            alt="hero background">
        
        <div id="content" class="reveal-scale relative z-10 flex flex-col w-full text-white px-6 md:px-12 lg:px-24">
            <p class="text-6xl md:text-8xl lg:text-9xl font-bold tracking-widest archivo">BRUTALISM</p>
            <span class="border h-px border-gray-700 w-[25%] my-4"></span>
            <p class="text-lg max-w-xl text-gray-200 playfair">An architectural movement that stripped away pretense to reveal the raw truth of structure, material, and human habitation.</p>
        </div>
        <!-- <span class="material-symbols-outlined text-gray-700 absolute left-1/2 bottom-2 z-[10]">arrow_downward</span> -->
    </section>

    <!-- SECTION 1 -->
    <section id="sec2" class="">

    </section>
    
</body>
</html>
